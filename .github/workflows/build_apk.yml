name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./sample
        run: flutter pub get

      - name: Generate Android launcher icons from brand logo
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Image.open('assets/branding/subly-logo-v1.png').convert('RGBA')
          root = Path('sample/android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = root / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              source.resize((size,size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher.png')
          PY

      - name: Build APK
        working-directory: ./sample
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: sample/build/app/outputs/flutter-apk/app-release.apk
